server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker: acha o container "backend" mesmo se ele for recriado
    resolver 127.0.0.11 valid=10s ipv6=off;

    # /todos, /todos/:id e /health vao para a API, no mesmo endereco publico
    location ~ ^/(todos|health)(/|$) {
        set $api http://backend:5000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Todo o resto e a interface React
    location / {
        try_files $uri /index.html;
    }
}
