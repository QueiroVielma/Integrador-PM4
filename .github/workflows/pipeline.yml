name: Pipeline PM-04 (Terraform + Ansible)

# Dispara: push na main (mudancas em app, terraform, ansible ou neste arquivo)
# ou Actions > Run workflow (com parametros). Pull Request so faz build e plan.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "terraform/**"
      - "ansible/**"
      - ".github/workflows/pipeline.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente de destino (cada um tem state, rede e VMs proprios)"
        type: choice
        options: [prod, homolog, dev]
        default: prod
      instance_name:
        description: "Nome base das VMs (vira <nome>-app e <nome>-db)"
        required: false
        default: "vm-pm04"
      app_instance_type:
        description: "Tamanho da VM da aplicacao"
        type: choice
        options: [t3.micro, t3.small, t3.medium]
        default: t3.small
      db_instance_type:
        description: "Tamanho da VM do banco (troca sem perder os dados)"
        type: choice
        options: [t3.micro, t3.small, t3.medium]
        default: t3.small
      docker_image:
        description: "Imagem da aplicacao sem o sufixo (vazio = ghcr.io/<dono>/todo, gera todo-backend e todo-frontend)"
        required: false
        default: ""
      docker_tag:
        description: "Versao das imagens (SHA de um commit ja publicado). Vazio = constroi o commit atual"
        required: false
        default: ""
      update_os:
        description: "Aplicar as atualizacoes do sistema operacional (pode reiniciar as VMs)"
        type: boolean
        default: false
      extra_packages:
        description: "Pacotes extras do apt, separados por espaco (ex: tcpdump traceroute)"
        required: false
        default: ""

# Evita duas execucoes mexendo no mesmo ambiente ao mesmo tempo
concurrency:
  group: infra-pm04-${{ inputs.environment || 'prod' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # publicar/baixar as imagens no ghcr.io

env:
  AWS_REGION: us-east-2
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
  # No push os parametros ficam vazios: ambiente prod e imagens do commit atual
  ENVIRONMENT: ${{ inputs.environment || 'prod' }}
  APP_VERSION: ${{ inputs.docker_tag || github.sha }}
  DOCKER_IMAGE: ${{ inputs.docker_image }}

jobs:
  build:
    name: Construir imagens (Docker)
    # Se foi pedida uma imagem ou versao ja existente, nao precisa construir
    if: ${{ !inputs.docker_tag && !inputs.docker_image }}
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Nome das imagens (o ghcr.io exige letras minusculas)
        run: echo "PREFIXO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Validar a sintaxe da API
        run: node --check app/backend/index.js

      - name: Construir imagem da API
        run: >
          docker build -t "$PREFIXO/todo-backend:$APP_VERSION"
          --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"
          app/backend

      - name: Construir imagem do frontend
        run: >
          docker build -t "$PREFIXO/todo-frontend:$APP_VERSION"
          --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"
          app/frontend

      - name: Login no GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar as imagens
        if: github.event_name != 'pull_request'
        run: |
          docker push "$PREFIXO/todo-backend:$APP_VERSION"
          docker push "$PREFIXO/todo-frontend:$APP_VERSION"
          echo "### Imagens publicadas (versao $APP_VERSION)" >> "$GITHUB_STEP_SUMMARY"
          echo "- $PREFIXO/todo-backend:$APP_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- $PREFIXO/todo-frontend:$APP_VERSION" >> "$GITHUB_STEP_SUMMARY"

  terraform:
    name: Provisionar (Terraform)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    outputs:
      app_id: ${{ steps.saidas.outputs.app_id }}
      db_id: ${{ steps.saidas.outputs.db_id }}
      db_ip: ${{ steps.saidas.outputs.db_ip }}
      app_url: ${{ steps.saidas.outputs.app_url }}

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # so precisa no AWS Academy
          aws-region: ${{ env.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      - name: Terraform fmt (padrao de formatacao)
        run: terraform fmt -check -recursive

      - name: Conferir os parametros
        env:
          INSTANCE_NAME: ${{ inputs.instance_name }}
        run: |
          if ! echo "$INSTANCE_NAME" | grep -Eq '^[a-z0-9-]{0,40}$'; then
            echo "instance_name invalido (use letras minusculas, numeros e hifen): $INSTANCE_NAME"
            exit 1
          fi

      # Cada ambiente tem o seu proprio state: dev, homolog e prod nunca se misturam
      - name: Terraform init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=pm04/$ENVIRONMENT/terraform.tfstate"

      - name: Terraform validate
        run: terraform validate

      # No push os parametros ficam vazios e valem os do terraform.tfvars
      - name: Terraform plan
        env:
          INSTANCE_NAME: ${{ inputs.instance_name }}
          APP_INSTANCE_TYPE: ${{ inputs.app_instance_type }}
          DB_INSTANCE_TYPE: ${{ inputs.db_instance_type }}
        run: |
          PARAMETROS="-var=environment=$ENVIRONMENT"
          if [ -n "$INSTANCE_NAME" ]; then PARAMETROS="$PARAMETROS -var=instance_name=$INSTANCE_NAME"; fi
          if [ -n "$APP_INSTANCE_TYPE" ]; then PARAMETROS="$PARAMETROS -var=app_instance_type=$APP_INSTANCE_TYPE"; fi
          if [ -n "$DB_INSTANCE_TYPE" ]; then PARAMETROS="$PARAMETROS -var=db_instance_type=$DB_INSTANCE_TYPE"; fi
          echo "Parametros do Terraform: $PARAMETROS"
          terraform plan -input=false -out=tfplan $PARAMETROS
          {
            echo "### Terraform plan (ambiente $ENVIRONMENT)"
            echo "- Parametros: $PARAMETROS"
            echo "- Resultado: \`$(terraform show -no-color tfplan | grep -E '^(Plan:|No changes)' || echo 'ver o log')\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Ler as saidas do Terraform
        id: saidas
        if: github.event_name != 'pull_request'
        run: |
          echo "app_id=$(terraform output -raw app_instance_id)" >> "$GITHUB_OUTPUT"
          echo "db_id=$(terraform output -raw db_instance_id)" >> "$GITHUB_OUTPUT"
          echo "db_ip=$(terraform output -raw db_private_ip)" >> "$GITHUB_OUTPUT"
          echo "app_url=$(terraform output -raw app_url)" >> "$GITHUB_OUTPUT"

  ansible:
    name: Configurar e implantar (Ansible)
    needs: [build, terraform]
    # Roda tambem quando o build foi pulado (rollback para versao anterior)
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      needs.terraform.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Instalar Session Manager Plugin (acesso as VMs privadas)
        run: |
          curl -sSLo /tmp/ssm.deb "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb"
          sudo dpkg -i /tmp/ssm.deb

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Ansible e as colecoes
        run: |
          pip install "ansible-core>=2.17,<2.19"
          ansible-galaxy collection install -r requirements.yml

      - name: Gravar a chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/pm04
          chmod 600 ~/.ssh/pm04

      - name: Gerar inventario com as saidas do Terraform
        run: >
          sh gerar-inventario.sh
          "${{ needs.terraform.outputs.app_id }}"
          "${{ needs.terraform.outputs.db_id }}"
          "${{ needs.terraform.outputs.db_ip }}"

      - name: Rodar o playbook
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATUALIZAR_SO: ${{ inputs.update_os }}
          PACOTES_EXTRAS: ${{ inputs.extra_packages }}
        run: |
          if ! echo "$PACOTES_EXTRAS" | grep -Eq '^[a-z0-9.+ ,-]*$'; then
            echo "Nome de pacote invalido em extra_packages: $PACOTES_EXTRAS"
            exit 1
          fi
          if ! echo "$DOCKER_IMAGE" | grep -Eq '^[a-z0-9./_-]*$' || ! echo "$APP_VERSION" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "docker_image ou docker_tag invalido"
            exit 1
          fi
          export IMAGE_BASE="${DOCKER_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/todo}"
          {
            echo "### Parametros desta execucao"
            echo "- Ambiente: \`$ENVIRONMENT\` | Nome das VMs: \`${{ inputs.instance_name || 'padrao do tfvars' }}\`"
            echo "- VM app: \`${{ inputs.app_instance_type || 'padrao do tfvars' }}\` | VM db: \`${{ inputs.db_instance_type || 'padrao do tfvars' }}\`"
            echo "- Imagens: \`$IMAGE_BASE-backend\` e \`$IMAGE_BASE-frontend\` | Tag: \`$APP_VERSION\`"
            echo "- update_os: \`${ATUALIZAR_SO:-false}\` | extra_packages: \`${PACOTES_EXTRAS:-nenhum}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          ansible-playbook site.yml | tee ansible.log
          {
            echo "### Ansible (changed=0 em todas as VMs = nada precisou mudar)"
            echo '```'
            sed -n '/PLAY RECAP/,$p' ansible.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Teste final pela URL publica (evidencia)
        run: |
          URL="${{ needs.terraform.outputs.app_url }}"
          echo "Testando $URL"
          for i in $(seq 1 30); do
            CODIGO=$(curl -s -o /tmp/saude.json -w "%{http_code}" "$URL/health" || true)
            echo "Tentativa $i: /health -> HTTP $CODIGO"
            if [ "$CODIGO" = "200" ]; then
              echo "Saude: $(cat /tmp/saude.json)"
              echo "Tarefas: $(curl -s "$URL/todos" | head -c 300)"
              {
                echo "### Aplicacao no ar ($ENVIRONMENT): $URL"
                echo "- Versao: \`$APP_VERSION\`"
                echo "- Saude: \`$(cat /tmp/saude.json)\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          echo "A aplicacao nao respondeu pela URL publica"
          exit 1
