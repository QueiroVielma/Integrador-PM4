# Exemplo. O inventory.ini de verdade e gerado pela pipeline
# com os IDs das VMs que sairam do "terraform output".
# Os hosts sao IDs de instancia porque o SSH passa pelo Session Manager.

[app]
i-0123456789abcdef0

[db]
i-0fedcba9876543210

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/pm04
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o ProxyCommand="aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p"
db_host=10.0.10.20
