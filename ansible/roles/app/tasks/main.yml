---
- name: Conferir se a pipeline informou a versao da aplicacao
  ansible.builtin.assert:
    that:
      - app_version | length > 0
      - image_prefix | length > 0
    fail_msg: "Faltou APP_VERSION/IMAGE_PREFIX (essas variaveis vem da pipeline)"

- name: Ver qual versao da API esta rodando agora
  community.docker.docker_container_info:
    name: backend
  register: backend_atual

- name: Decidir se precisa baixar uma versao nova
  ansible.builtin.set_fact:
    versao_nova: "{{ (not backend_atual.exists or backend_atual.container.Config.Image != backend_image) | bool }}"

- name: Versao atual x versao pedida
  ansible.builtin.debug:
    msg: >-
      Rodando: {{ backend_atual.container.Config.Image if backend_atual.exists else 'nenhuma (primeira instalacao)' }}
      | Pedida: {{ backend_image }}
      | {{ 'vai atualizar' if versao_nova else 'nada a atualizar' }}

- name: Testar se a VM da aplicacao alcanca o banco pela rede privada
  ansible.builtin.wait_for:
    host: "{{ db_host }}"
    port: "{{ db_port }}"
    timeout: 120

- name: Login no registry do GitHub (token temporario da pipeline)
  community.docker.docker_login:
    registry_url: ghcr.io
    username: "{{ registry_user }}"
    password: "{{ registry_token }}"
  when: versao_nova and registry_token | length > 0
  no_log: true

- name: Rede Docker interna entre o Nginx e a API
  community.docker.docker_network:
    name: todo-net

- name: Subir a API (backend) - versao {{ app_version }}
  community.docker.docker_container:
    name: backend
    image: "{{ backend_image }}"
    state: started
    restart_policy: always
    networks:
      - name: todo-net
    # A API nao publica porta: so o Nginx (frontend) conversa com ela
    env:
      MONGO_HOST: "{{ db_host }}"
      MONGO_PORT: "{{ db_port | string }}"
      MONGO_DB: "{{ db_name }}"
      MONGO_USER: "{{ db_user }}"
      MONGO_PASSWORD: "{{ db_password }}"
      APP_VERSION: "{{ app_version }}"
  no_log: true

- name: Subir o frontend (Nginx + React) - versao {{ app_version }}
  community.docker.docker_container:
    name: frontend
    image: "{{ frontend_image }}"
    state: started
    restart_policy: always
    networks:
      - name: todo-net
    published_ports:
      - "80:80"

- name: Sair do registry (nao deixar token salvo na VM)
  community.docker.docker_login:
    registry_url: ghcr.io
    state: absent
  when: versao_nova and registry_token | length > 0

- name: Verificar a saude (Nginx -> API -> MongoDB) dentro da VM
  ansible.builtin.uri:
    url: http://localhost/health
    return_content: true
  register: saude
  until: saude.status == 200
  retries: 18
  delay: 10

- name: Resultado da verificacao de saude
  ansible.builtin.debug:
    msg: "{{ saude.json }}"

- name: Ler os containers depois do deploy
  community.docker.docker_container_info:
    name: "{{ item }}"
  loop: [backend, frontend]
  register: containers

- name: Conferir se os containers estao rodando na versao pedida
  ansible.builtin.assert:
    that:
      - item.container.State.Running
      - item.container.Config.Image is search(app_version)
    fail_msg: "{{ item.item }} nao esta rodando a versao {{ app_version }}"
    success_msg: "{{ item.item }} rodando {{ item.container.Config.Image }}"
  loop: "{{ containers.results }}"
  loop_control:
    label: "{{ item.item }}"
